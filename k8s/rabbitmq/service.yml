apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: management-port
      protocol: TCP
      port: 15672
      targetPort: 15672
      nodePort: 32000
    - name: amqp-port
      protocol: TCP
      port: 5672
      targetPort: 5672
  type: NodePort
